<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Enigne</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200">
    <nav class="flex items-center justify-between bg-white px-6 py-3 border-b border-gray-200">
  
  <div class="text-blue-600 font-bold text-xl">Web Engine</div>

  <form action="/search" method="POST" class="flex">
    <input name="user_query" class="border bg-gray-200 px-3 h-8 w-64 outline-none rounded-l-md" placeholder="Search" value="{{query}}"/>
    <button class="rounded-r-md bg-blue-600 h-8 px-4 text-gray-200">Go</button>
  </form>

  <div class="flex gap-6 text-gray-600">
    <a href="/" class="hover:text-blue-600">Home</a>
  </div>
</nav>
    <div class="p-8">
        {% for title, url, body in web[query] %}
        <div class="bg-gray-200 pb-8 max-w-2xl mx-auto">
            <p class="text-sm text-gray-500 truncate">{{url}}</p>
            <h1 class="text-2xl text-blue-600 truncate"><a href="{{url}}"> {{title }}</a></h1>
            <p class="text-gray-600 clamp-4"> {{ body }} </p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
